name: Cart reminders

on:
  schedule:
    # Cada 15 minutos. La imprecisión de unos minutos es irrelevante para
    # ventanas de 1h/24h/48h.
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      hour_ms:
        description: 'Modo test: comprimir la unidad de tiempo en ms (ej. 1000 = 1 seg). Vacío = 1 hora real.'
        required: false
        default: ''

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: node scripts/cart-reminders.js
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SITE_URL: ${{ secrets.SITE_URL }}
          REMINDER_HOUR_MS: ${{ github.event.inputs.hour_ms }}
