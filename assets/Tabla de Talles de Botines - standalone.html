document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ont-display: swap;\n  src: url(\"7c7b87e0-59ad-4c6d-999c-36b9255ec2d4\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"2e361dbd-2b25-41b4-a503-c6425e272c07\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"e4877ed1-2656-4d50-89fb-85cd00cc7ff3\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"7c7b87e0-59ad-4c6d-999c-36b9255ec2d4\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"2e361dbd-2b25-41b4-a503-c6425e272c07\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n  <style>\n    *, *::before, *::after { box-sizing: border-box; }\n    body { margin: 0; }\n    tbody tr { transition: background 0.12s; }\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height: 100vh; background: #0a0a0a; padding: 72px 24px 80px; font-family: 'Space Grotesk', system-ui, sans-serif; color: #fff;\">\n  <div style=\"max-width: 660px; margin: 0 auto;\">\n\n    <!-- Header -->\n    <div style=\"margin-bottom: 52px;\">\n      \n      <h1 style=\"margin: 0 0 6px; font-size: 44px; font-weight: 700; letter-spacing: -0.04em; line-height: 1; color: #ffffff; font-family: DM Sans\">Tabla de Talles<\u002Fh1>\n      \n      \n    <\u002Fdiv>\n\n    <!-- Tab Switcher -->\n    <div style=\"display: flex; border-bottom: 1px solid #1c1c1c; margin-bottom: 0;\">\n      <button onclick=\"{{ setHombre }}\" style=\"{{ hombreBtnStyle }}\">Hombre<\u002Fbutton>\n      <button onclick=\"{{ setMujer }}\" style=\"{{ mujerBtnStyle }}\">Mujer<\u002Fbutton>\n    <\u002Fdiv>\n\n    <!-- Table -->\n    <sc-for list=\"{{ rows }}\" as=\"row\" hint-placeholder-count=\"9\">\n          <\u002Fsc-for><table style=\"width: 100%; border-collapse: collapse;\">\n      <thead>\n        <tr>\n          <th style=\"text-align: left; padding: 18px 0 14px; font-size: 9px; letter-spacing: 0.28em; text-transform: uppercase; color: #FFFBFB; font-weight: 700; border-bottom: 1px solid #1c1c1c; width: 15%\">EU<\u002Fth>\n          <th style=\"text-align: left; padding: 18px 0 14px; font-size: 9px; letter-spacing: 0.28em; text-transform: uppercase; color: #FFFCFC; font-weight: 700; border-bottom: 1px solid #1c1c1c; width: 20%\">US<\u002Fth>\n          <th style=\"text-align: left; padding: 18px 0 14px; font-size: 9px; letter-spacing: 0.28em; text-transform: uppercase; color: #F5F0F0; font-weight: 700; border-bottom: 1px solid #1c1c1c; width: 20%\">UK<\u002Fth>\n          <th style=\"text-align: left; padding: 18px 0 14px; font-size: 9px; letter-spacing: 0.28em; text-transform: uppercase; color: {{ accentColor }}; font-weight: 700; border-bottom: 1px solid #1c1c1c; width: 18%\">AR<\u002Fth>\n          <th style=\"text-align: left; padding: 18px 0 14px; font-size: 9px; letter-spacing: 0.28em; text-transform: uppercase; color: #FFFFFF; font-weight: 700; border-bottom: 1px solid #1c1c1c; width: 27%\">CM del pie<\u002Fth>\n        <\u002Ftr>\n      <\u002Fthead>\n      <tbody>\n        <tr style=\"{{ row.rowStyle }}\" onclick=\"{{ row.onClick }}\" style-hover=\"background: #111111; cursor: pointer;\">\n            <td style=\"padding: 15px 0; font-size: 24px; font-weight: 700; color: #ffffff; border-bottom: 1px solid #141414; letter-spacing: -0.03em; line-height: 1;\">{{ row.eu }}<\u002Ftd>\n            <td style=\"padding: 15px 0; font-size: 16px; font-weight: 700; color: #F6F4F4; border-bottom: 1px solid #141414\">{{ row.us }}<\u002Ftd>\n            <td style=\"padding: 15px 0; font-size: 16px; font-weight: 700; color: #FFFAFA; border-bottom: 1px solid #141414\">{{ row.uk }}<\u002Ftd>\n            <td style=\"padding: 15px 0; font-size: 16px; font-weight: 600; color: {{ accentColor }}; border-bottom: 1px solid #141414;\">{{ row.ar }}<\u002Ftd>\n            <td style=\"padding: 15px 0; border-bottom: 1px solid #141414;\">\n              <span style=\"font-size: 16px; font-weight: 700; color: #FFFFFF\">{{ row.cm }}<\u002Fspan>\n              <span style=\"font-size: 11px; color: #FFFFFF; margin-left: 4px; font-weight: 700\">cm<\u002Fspan>\n            <\u002Ftd>\n          <\u002Ftr>\n        \n      <\u002Ftbody>\n    <\u002Ftable>\n\n    <!-- Selected size callout -->\n    <sc-if value=\"{{ hasSelection }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"margin-top: 24px; padding: 16px 20px; border: 1px solid #1e2800; background: #0f1500; border-radius: 6px; display: flex; align-items: center; justify-content: space-between;\">\n        <div style=\"display: flex; align-items: center; gap: 12px;\">\n          <span style=\"font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: #4a4a4a; font-weight: 500;\">Talle seleccionado<\u002Fspan>\n          <span style=\"font-size: 18px; font-weight: 700; color: #fff;\">EU {{ selectedRow.eu }}<\u002Fspan>\n          <span style=\"font-size: 13px; color: {{ accentColor }}; font-weight: 600;\">AR {{ selectedRow.ar }}<\u002Fspan>\n        <\u002Fdiv>\n        <button onclick=\"{{ clearSelection }}\" style=\"background: none; border: none; cursor: pointer; font-size: 11px; color: #3a3a3a; font-family: inherit; letter-spacing: 0.1em; text-transform: uppercase; padding: 0;\">Limpiar<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- Measurement Guide -->\n    \n\n    <!-- Disclaimer -->\n    <p style=\"margin: 40px 0 0; font-size: 10px; color: #FFFFFF; text-align: center; letter-spacing: 0.06em; line-height: 1.8\">Los talles son orientativos · Pueden variar según fabricante y modelo&nbsp;<\u002Fp>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:700,&quot;height&quot;:820},&quot;accentColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#FFFFFF&quot;,&quot;options&quot;:[&quot;#CCFF00&quot;,&quot;#00FF87&quot;,&quot;#FFFFFF&quot;,&quot;#FF6B35&quot;,&quot;#3B82F6&quot;],&quot;section&quot;:&quot;Visual&quot;}}\">\nclass Component extends DCLogic {\n  state = { tab: 'hombre', selectedEU: null };\n\n  renderVals() {\n    const { tab, selectedEU } = this.state;\n    const accent = this.props.accentColor ?? '#CCFF00';\n\n    const menRows = [\n      { eu: '38', us: '5½', uk: '4½', ar: '37', cm: '24,0' },\n      { eu: '39', us: '6½', uk: '5½', ar: '38', cm: '24,5' },\n      { eu: '40', us: '7',  uk: '6',  ar: '39', cm: '25,0' },\n      { eu: '41', us: '8',  uk: '7',  ar: '40', cm: '26,0' },\n      { eu: '42', us: '8½', uk: '7½', ar: '41', cm: '26,5' },\n      { eu: '43', us: '9½', uk: '8½', ar: '42', cm: '27,5' },\n      { eu: '44', us: '10', uk: '9½', ar: '43', cm: '28,0' },\n      { eu: '45', us: '11', uk: '10', ar: '44', cm: '29,0' },\n      { eu: '46', us: '12', uk: '11', ar: '45', cm: '29,5' },\n    ];\n\n    const womenRows = [\n      { eu: '36', us: '5',  uk: '3',  ar: '35', cm: '23,0' },\n      { eu: '37', us: '6',  uk: '4',  ar: '36', cm: '23,5' },\n      { eu: '38', us: '7',  uk: '5',  ar: '37', cm: '24,0' },\n      { eu: '39', us: '8',  uk: '5½', ar: '38', cm: '24,5' },\n      { eu: '40', us: '9',  uk: '6½', ar: '39', cm: '25,5' },\n      { eu: '41', us: '9½', uk: '7½', ar: '40', cm: '26,0' },\n    ];\n\n    const baseRows = tab === 'hombre' ? menRows : womenRows;\n\n    const rows = baseRows.map(row => {\n      const isSelected = row.eu === selectedEU;\n      return {\n        ...row,\n        rowStyle: isSelected\n          ? { background: '#131800', borderLeft: `2px solid ${accent}` }\n          : { background: 'transparent' },\n        onClick: () => this.setState(s => ({\n          selectedEU: s.selectedEU === row.eu ? null : row.eu,\n        })),\n      };\n    });\n\n    const selectedRow = baseRows.find(r => r.eu === selectedEU) ?? null;\n\n    const baseBtn = {\n      background: '#0a0a0a',\n      border: 'none',\n      cursor: 'pointer',\n      padding: '14px 0',\n      marginRight: '32px',\n      fontSize: '12px',\n      fontWeight: '500',\n      letterSpacing: '0.14em',\n      textTransform: 'uppercase',\n      fontFamily: 'DM Sans, Space Grotesk, system-ui, sans-serif',\n    };\n\n    return {\n      rows,\n      hasSelection: !!selectedRow,\n      selectedRow: selectedRow ?? {},\n      clearSelection: () => this.setState({ selectedEU: null }),\n      setHombre: () => this.setState({ tab: 'hombre', selectedEU: null }),\n      setMujer:  () => this.setState({ tab: 'mujer',  selectedEU: null }),\n      accentColor: accent,\n      hombreBtnStyle: {\n        ...baseBtn,\n        color: tab === 'hombre' ? '#fff' : '#3a3a3a',\n        borderBottom: `2px solid ${tab === 'hombre' ? accent : 'transparent'}`,\n      },\n      mujerBtnStyle: {\n        ...baseBtn,\n        marginRight: 0,\n        color: tab === 'mujer' ? '#fff' : '#3a3a3a',\n        borderBottom: `2px solid ${tab === 'mujer' ? accent : 'transparent'}`,\n      },\n    };\n  }\n}\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
